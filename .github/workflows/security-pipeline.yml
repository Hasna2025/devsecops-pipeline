name: "🛡️ DevSecOps Security Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ════ STAGE 1 : SAST avec Semgrep ════
  # FIX : remplacé returntocorp/semgrep-action@v1 par CLI directe
  #       → génère semgrep.sarif manuellement avec --sarif --output
  #       → || true évite l'échec du step (le Gate gère l'échec final)
  sast:
    name: "🔍 Stage 1 — SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "🐍 Install Semgrep"
        run: pip install semgrep

      - name: "🔍 Run Semgrep SAST"
        run: |
          semgrep \
            --config p/python \
            --config p/flask \
            --config p/security-audit \
            --sarif \
            --output semgrep.sarif \

# . || true
        # || true : Semgrep retourne exit code 1 si findings → on laisse
        # le Security Gate décider du blocage, pas ce step individuel

      - name: "✅ Verify semgrep.sarif exists"
        run: |
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
          fi
          echo "semgrep.sarif size: $(wc -c < semgrep.sarif) bytes"

      # FIX : v3 → v4 (dépréciation décembre 2026)
      - name: "📊 Upload SARIF → GitHub Security"
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: "SAST-Semgrep"


  # ════ STAGE 2 : Container Scan avec Trivy ════
  container-scan:
    name: "🐳 Stage 2 — Container Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build Docker image"
        run: docker build -t devsecops-app:${{ github.sha }} .

      - name: "🐳 Run Trivy vulnerability scanner"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-app:${{ github.sha }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln,secret

      - name: "✅ Verify trivy-results.sarif exists"
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif
          fi

      # FIX : v3 → v4
      - name: "📊 Upload Trivy SARIF → GitHub Security"
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: "Container-Trivy"

      - name: "💾 Save Trivy report artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 30


  # ════ STAGE 3 : SCA avec Snyk ════
  # FIX : ajout pip install AVANT snyk/actions/python
  #       Snyk exige que les packages soient installés localement
  #       pour résoudre l'arbre de dépendances (erreur SNYK-OS-PYTHON-0013)
  sca:
    name: "📦 Stage 3 — SCA (Snyk)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # FIX CRITIQUE : installer les dépendances avant le scan Snyk
      # Sans ça → erreur "Missing required packages" (SNYK-OS-PYTHON-0013)
      - name: "📦 Install dependencies (requis par Snyk)"
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt || true
        # || true : certaines deps obsolètes peuvent échouer à installer
        # Snyk a juste besoin que pip puisse résoudre l'arbre

      - name: "🔎 Run Snyk SCA scan"
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --file=app/requirements.txt
            --sarif-file-output=snyk-results.sarif

      - name: "✅ Verify snyk-results.sarif exists"
        if: always()
        run: |
          if [ ! -f snyk-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > snyk-results.sarif
          fi

      # FIX : v3 → v4
      - name: "📊 Upload Snyk SARIF → GitHub Security"
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-results.sarif
          category: "SCA-Snyk"


  # ════ STAGE 4 : DAST avec OWASP ZAP ════
  dast:
    name: "🌐 Stage 4 — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [sast, container-scan]
    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build and start target application"
        run: |
          docker build -t devsecops-app:dast .
          docker run -d \
            --name target-app \
            -p 5000:5000 \
            devsecops-app:dast
          echo "⏳ Waiting for Flask to start..."
          sleep 20
          curl -f http://localhost:5000/ || (echo "❌ App not responding" && exit 1)
          echo "✅ App ready for DAST scan"

      - name: "🌐 OWASP ZAP Baseline Scan"
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"
          allow_issue_writing: true

      - name: "💾 Save ZAP HTML report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 30

      - name: "🛑 Stop target container"
        if: always()
        run: docker stop target-app && docker rm target-app


  # ════ STAGE 5 : Security Gate ════
  security-gate:
    name: "🚦 Stage 5 — Security Gate"
    runs-on: ubuntu-latest
    needs: [sast, container-scan, sca, dast]
    if: always()
    steps:
      - name: "📋 Final security report"
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║        RAPPORT SÉCURITÉ DEVSECOPS            ║"
          echo "║  Commit : ${{ github.sha }}                  ║"
          echo "║  Branch : ${{ github.ref_name }}             ║"
          echo "╚══════════════════════════════════════════════╝"
          echo ""
          echo "📊 RÉSULTATS PAR STAGE :"
          echo "  Stage 1 SAST (Semgrep)    : ${{ needs.sast.result }}"
          echo "  Stage 2 Container (Trivy) : ${{ needs.container-scan.result }}"
          echo "  Stage 3 SCA (Snyk)        : ${{ needs.sca.result }}"
          echo "  Stage 4 DAST (ZAP)        : ${{ needs.dast.result }}"
          echo ""
          if [[ "${{ needs.sast.result }}" == "failure" || \
                "${{ needs.container-scan.result }}" == "failure" || \
                "${{ needs.sca.result }}" == "failure" || \
                "${{ needs.dast.result }}" == "failure" ]]; then
            echo "🔴 SECURITY GATE : ❌ DÉPLOIEMENT BLOQUÉ"
            echo "   → Onglet Security : github.com/${{ github.repository }}/security"
            echo "   → Rapports        : Actions > Artifacts"
            exit 1
          else
            echo "🟢 SECURITY GATE : ✅ DÉPLOIEMENT AUTORISÉ"
          fi