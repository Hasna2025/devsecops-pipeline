name: "🛡️ DevSecOps Security Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ══════════════════════════════════════════════════════════
  # STAGE 1 — SAST avec Semgrep
  # ══════════════════════════════════════════════════════════
  sast:
    name: "🔍 Stage 1 — SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Installation de Semgrep"
        run: pip install semgrep

      - name: "🔍 Scan Semgrep → SARIF direct"
        # semgrep scan --sarif écrit le SARIF directement
        # || true = ne pas échouer ici, le Gate gère la décision
        run: |
          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            . || true

      - name: "✅ Vérification semgrep.sarif"
        run: |
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
          fi
          echo "✅ semgrep.sarif OK ($(wc -c < semgrep.sarif) octets)"

      - name: "📊 Upload SARIF → GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: "SAST-Semgrep"

  # ══════════════════════════════════════════════════════════
  # STAGE 2 — Container Scan avec Trivy
  # ══════════════════════════════════════════════════════════
  container-scan:
    name: "🐳 Stage 2 — Container Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Build image Docker"
        run: docker build -t devsecops-app:${{ github.sha }} .

      - name: "🐳 Scan Trivy"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-app:${{ github.sha }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln,secret

      - name: "✅ Vérification trivy-results.sarif"
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif
          fi

      - name: "📊 Upload SARIF → GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: "Container-Trivy"

      - name: "💾 Artifact Trivy"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # STAGE 3 — SCA avec Snyk
  # ══════════════════════════════════════════════════════════
  sca:
    name: "📦 Stage 3 — SCA (Snyk)"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 Installation dépendances (requis par Snyk)"
        run: pip install -r app/requirements.txt || true

      - name: "🔎 Scan Snyk"
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --file=app/requirements.txt

      - name: "📊 Upload SARIF → GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-results.sarif
          category: "SCA-Snyk"

  # ══════════════════════════════════════════════════════════
  # STAGE 4 — DAST avec OWASP ZAP
  # Lance seulement si Stage 1 + Stage 2 passent
  # ══════════════════════════════════════════════════════════
  dast:
    name: "🌐 Stage 4 — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [sast, container-scan]
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Build + démarrage app cible"
        run: |
          docker build -t devsecops-app:dast .
          docker run -d --name target-app -p 5000:5000 devsecops-app:dast
          sleep 20
          curl -f http://localhost:5000/ || (echo "❌ App ne répond pas" && exit 1)

      - name: "🌐 Scan OWASP ZAP Baseline"
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"
          allow_issue_writing: true

      - name: "💾 Artifact ZAP HTML"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 30

      - name: "🛑 Arrêt container"
        if: always()
        run: docker stop target-app && docker rm target-app

  # ══════════════════════════════════════════════════════════
  # STAGE 5 — Security Gate
  # ══════════════════════════════════════════════════════════
  security-gate:
    name: "🚦 Stage 5 — Security Gate"
    runs-on: ubuntu-latest
    needs: [sast, container-scan, sca, dast]
    if: always()
    steps:
      - name: "📋 Rapport final"
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║        RAPPORT SÉCURITÉ DEVSECOPS            ║"
          echo "║  Commit : ${{ github.sha }}                  ║"
          echo "║  Branch : ${{ github.ref_name }}             ║"
          echo "╚══════════════════════════════════════════════╝"
          echo ""
          echo "📊 RÉSULTATS PAR STAGE :"
          echo "  Stage 1 SAST (Semgrep)    : ${{ needs.sast.result }}"
          echo "  Stage 2 Container (Trivy) : ${{ needs.container-scan.result }}"
          echo "  Stage 3 SCA (Snyk)        : ${{ needs.sca.result }}"
          echo "  Stage 4 DAST (ZAP)        : ${{ needs.dast.result }}"
          echo ""
          if [[ "${{ needs.sast.result }}"           == "failure" || \
                "${{ needs.container-scan.result }}" == "failure" || \
                "${{ needs.sca.result }}"            == "failure" || \
                "${{ needs.dast.result }}"           == "failure" ]]; then
            echo "🔴 SECURITY GATE : ❌ DÉPLOIEMENT BLOQUÉ"
            exit 1
          else
            echo "🟢 SECURITY GATE : ✅ DÉPLOIEMENT AUTORISÉ"
          fi